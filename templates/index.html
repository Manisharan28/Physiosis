<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physiosis | Real-Time Biomechanical Analysis</title>
  <meta name="description" content="Real-time AI-powered biomechanical posture analysis powered by MediaPipe and FastAPI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* ── CSS Variables (Dark default) ───────────────────────────────────────── */
    :root {
      --bg:             #0d1117;
      --panel:          #161b22;
      --card:           #1c2128;
      --border:         #30363d;
      --border-soft:    #21262d;
      --text:           #e6edf3;
      --muted:          #7d8590;
      --subtle:         #484f58;
      --accent:         #3b82f6;
      --accent-glow:    rgba(59,130,246,0.35);
      --good:           #10b981;
      --good-bg:        rgba(16,185,129,0.1);
      --good-border:    rgba(16,185,129,0.3);
      --bad:            #ef4444;
      --bad-bg:         rgba(239,68,68,0.1);
      --bad-border:     rgba(239,68,68,0.3);
      --waiting:        #f59e0b;
      --waiting-bg:     rgba(245,158,11,0.1);
      --waiting-border: rgba(245,158,11,0.3);
      --chart-grid:     rgba(255,255,255,0.04);
      --chart-line:     #3b82f6;
      --scan-overlay:   rgba(0,0,0,0.15);
    }

    [data-theme="light"] {
      --bg:             #f0f4f8;
      --panel:          #ffffff;
      --card:           #f8fafc;
      --border:         #e2e8f0;
      --border-soft:    #edf2f7;
      --text:           #1a202c;
      --muted:          #718096;
      --subtle:         #a0aec0;
      --accent:         #2563eb;
      --accent-glow:    rgba(37,99,235,0.25);
      --good:           #059669;
      --good-bg:        rgba(5,150,105,0.08);
      --good-border:    rgba(5,150,105,0.25);
      --bad:            #dc2626;
      --bad-bg:         rgba(220,38,38,0.08);
      --bad-border:     rgba(220,38,38,0.25);
      --waiting:        #d97706;
      --waiting-bg:     rgba(217,119,6,0.08);
      --waiting-border: rgba(217,119,6,0.25);
      --chart-grid:     rgba(0,0,0,0.05);
      --chart-line:     #2563eb;
      --scan-overlay:   rgba(0,0,0,0.02);
    }

    /* ── Reset & Base ────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.5rem;
      height: 60px;
      flex-shrink: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo i {
      color: var(--accent);
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .logo span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      transition: all 0.4s ease;
    }

    .status-badge.connected {
      background: var(--good-bg);
      border-color: var(--good-border);
      color: var(--good);
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s ease;
    }

    .status-badge.connected .status-dot {
      background: var(--good);
      box-shadow: 0 0 6px var(--good);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .theme-toggle {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background: var(--border);
      transform: rotate(15deg);
    }

    /* ── Main Layout ─────────────────────────────────────────────────────────── */
    .container {
      display: flex;
      flex: 1;
      gap: 1.25rem;
      padding: 1.25rem;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* ── Left Column ─────────────────────────────────────────────────────────── */
    .left-col {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-width: 0;
    }

    /* ── Video Section ───────────────────────────────────────────────────────── */
    .video-section {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: background 0.35s ease, border-color 0.35s ease;
      min-height: 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
      transition: border-color 0.35s ease;
    }

    .section-header h2 {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .section-header h2 i { color: var(--accent); font-size: 0.95rem; }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .live-pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse-dot 1.2s infinite;
    }

    .stream-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      border-radius: 0 0 14px 14px;
    }

    /* premium scanline overlay */
    .stream-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        var(--scan-overlay) 2px,
        var(--scan-overlay) 4px
      );
      pointer-events: none;
      z-index: 2;
    }

    #processedImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    .loading-overlay i {
      font-size: 2.5rem;
      color: var(--accent);
      animation: spin 1.2s linear infinite;
    }

    .loading-overlay p {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Chart Section ───────────────────────────────────────────────────────── */
    .chart-section {
      height: 195px;
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.1rem;
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
    }

    .chart-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .chart-header p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .avg-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .avg-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .avg-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      transition: color 0.4s ease;
    }

    .chart-wrapper {
      flex: 1;
      padding: 6px 10px 8px;
      min-height: 0;
    }

    /* ── Diagnostics Panel ───────────────────────────────────────────────────── */
    .diagnostics-section {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .diag-header-block {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
    }

    .diag-header-block h2 { font-size: 1.1rem; font-weight: 600; }
    .diag-header-block p  { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }

    #diagnosticsList {
      flex: 1;
      overflow-y: auto;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* scrollbar */
    #diagnosticsList::-webkit-scrollbar           { width: 5px; }
    #diagnosticsList::-webkit-scrollbar-track     { background: transparent; }
    #diagnosticsList::-webkit-scrollbar-thumb     { background: var(--border); border-radius: 4px; }
    #diagnosticsList::-webkit-scrollbar-thumb:hover{ background: var(--accent); }

    .placeholder-msg {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 1rem;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .placeholder-msg i { font-size: 1.6rem; color: var(--subtle); }

    /* ── Diagnostic Cards ────────────────────────────────────────────────────── */
    .diag-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      transition: border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
      animation: slide-in 0.35s ease both;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .diag-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }

    .diag-card.state-good    { border-color: var(--good-border);    background: var(--good-bg); }
    .diag-card.state-bad     { border-color: var(--bad-border);     background: var(--bad-bg);
                                box-shadow: 0 0 12px rgba(239,68,68,0.12); }
    .diag-card.state-waiting { border-color: var(--waiting-border); background: var(--waiting-bg); }

    .diag-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }

    .diag-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .diag-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .diag-badge.good    { color: var(--good);    background: var(--good-bg);    border: 1px solid var(--good-border); }
    .diag-badge.bad     { color: var(--bad);     background: var(--bad-bg);     border: 1px solid var(--bad-border); }
    .diag-badge.waiting { color: var(--waiting); background: var(--waiting-bg); border: 1px solid var(--waiting-border); }

    .diag-tip {
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.45;
      margin-bottom: 8px;
      transition: color 0.35s ease;
    }

    /* severity bar */
    .sev-bar-wrap {
      height: 5px;
      background: var(--border-soft);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 4px;
    }

    .sev-bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width 0.5s ease, background-color 0.5s ease;
    }

    /* legend row */
    .ghost-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .ghost-legend-dot {
      width: 20px;
      height: 3px;
      background: #00dc6e;
      border-radius: 2px;
      flex-shrink: 0;
      position: relative;
      background: repeating-linear-gradient(
        90deg, #00dc6e 0px, #00dc6e 5px, transparent 5px, transparent 9px
      );
    }

    /* video dropdown */
    .video-dropdown {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease;
    }
    .diag-card:hover .video-dropdown {
      max-height: 250px;
      opacity: 1;
      margin-top: 10px;
    }
    .video-inner {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
      cursor: pointer;
    }
    .video-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }
    .video-inner:hover .video-thumb {
      opacity: 1;
    }
    .video-play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      pointer-events: none;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .video-inner:hover .video-play-icon {
      color: #ef4444;
      transform: translate(-50%, -50%) scale(1.1);
    }
    .video-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
      text-align: right;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<!-- Hidden capture elements -->
<video id="webcamVideo" autoplay playsinline style="display:none;"></video>
<canvas id="captureCanvas" style="display:none;"></canvas>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <i class="fa-solid fa-person-walking"></i>
    Physio<span>sis</span>
  </div>
  <div class="header-right">
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Connecting…</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme" title="Toggle Dark / Light mode">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
  </div>
</header>

<!-- ── Layout ─────────────────────────────────────────────────────────────── -->
<div class="container">

  <!-- Left column -->
  <div class="left-col">

    <!-- Video -->
    <div class="video-section">
      <div class="section-header">
        <h2><i class="fa-solid fa-camera-retro"></i> Live Engine Feed</h2>
        <div class="live-pill"><span class="live-pulse"></span> LIVE</div>
      </div>
      <div class="stream-container">
        <div class="loading-overlay" id="loadingOverlay">
          <i class="fa-solid fa-circle-notch"></i>
          <p>Initializing MediaPipe Engine…</p>
        </div>
        <img id="processedImage" src="" alt="Live Analysis Stream" />
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-section">
      <div class="chart-header">
        <div>
          <h3><i class="fa-solid fa-chart-line" style="color:var(--accent);margin-right:6px;"></i>Session Health</h3>
          <p>Average severity score · rolling 60 s</p>
        </div>
        <div class="avg-badge">
          <span class="avg-label">Avg Severity</span>
          <span class="avg-value" id="avgSeverityBadge">0</span>
        </div>
      </div>
      <div class="chart-wrapper">
        <canvas id="healthChart"></canvas>
      </div>
    </div>

  </div><!-- /left-col -->

  <!-- Right column: Diagnostics -->
  <div class="diagnostics-section">
    <div class="diag-header-block">
      <h2><i class="fa-solid fa-stethoscope" style="color:var(--accent);margin-right:8px;"></i>Analysis</h2>
      <p>Real-time pose evaluation &amp; correction</p>
    </div>
    <div id="diagnosticsList">
      <div class="placeholder-msg">
        <i class="fa-solid fa-satellite-dish fa-spin"></i>
        Waiting for analysis engine…
      </div>
    </div>
  </div>

</div><!-- /container -->

<script>
document.addEventListener('DOMContentLoaded', () => {

  // ── Elements ──────────────────────────────────────────────────────────────
  const video           = document.getElementById('webcamVideo');
  const canvas          = document.getElementById('captureCanvas');
  const ctx             = canvas.getContext('2d');
  const processedImage  = document.getElementById('processedImage');
  const diagList        = document.getElementById('diagnosticsList');
  const loadingOverlay  = document.getElementById('loadingOverlay');
  const statusBadge     = document.getElementById('statusBadge');
  const statusText      = document.getElementById('statusText');
  const themeToggle     = document.getElementById('themeToggle');
  const themeIcon       = document.getElementById('themeIcon');
  const avgBadge        = document.getElementById('avgSeverityBadge');

  // ── Theme Toggle ──────────────────────────────────────────────────────────
  let isDark = true;
  themeToggle.addEventListener('click', () => {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    themeIcon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    updateChartTheme();
  });

  // ── Severity helpers ──────────────────────────────────────────────────────
  function severityColor(s) {
    // 0 → yellow #f59e0b  ···  100 → red #ef4444
    const t = s / 100;
    const r = Math.round(245 + (239 - 245) * t);
    const g = Math.round(158 + ( 68 - 158) * t);
    const b = Math.round( 11 + ( 68 -  11) * t);
    return `rgb(${r},${g},${b})`;
  }

  // ── Card map (diff-based updates, no flicker) ─────────────────────────────
  const cardMap = new Map(); // issue → { el, parts }

  function getStatusClass(status) {
    if (status === 'Good')    return 'good';
    if (status === 'Bad')     return 'bad';
    return 'waiting';
  }

  function getIcon(status) {
    if (status === 'Good')    return 'fa-circle-check';
    if (status === 'Bad')     return 'fa-circle-exclamation';
    return 'fa-circle-notch fa-spin';
  }

  function extractYouTubeId(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  function createCard(diag) {
    const sc  = getStatusClass(diag.status);
    const ic  = getIcon(diag.status);
    const sev = diag.severity || 0;

    const el = document.createElement('div');
    el.className = `diag-card state-${sc}`;

    el.innerHTML = `
      <div class="diag-top">
        <span class="diag-title">${diag.issue}</span>
        <span class="diag-badge ${sc}">
          <i class="fa-solid ${ic}"></i> ${diag.status}
        </span>
      </div>
      <div class="diag-tip">${diag.tip}</div>
      <div class="sev-bar-wrap" style="display:${sev > 0 ? 'block' : 'none'}">
        <div class="sev-bar-fill" style="width:${sev}%;background-color:${severityColor(sev)};"></div>
      </div>
      ${sev > 0 ? `<div class="ghost-legend"><span class="ghost-legend-dot"></span> Green dashes = ideal target position on feed</div>` : ''}
      ${(diag.video && diag.status === 'Bad') ? `
        <div class="video-dropdown">
          <div class="video-inner" onclick="window.open('${diag.video}', '_blank')">
            <img class="video-thumb" src="https://img.youtube.com/vi/${extractYouTubeId(diag.video)}/0.jpg" alt="Exercise Video">
            <i class="fa-brands fa-youtube video-play-icon"></i>
          </div>
          <div class="video-label">Suggested Exercise</div>
        </div>
      ` : ''}
    `;

    return el;
  }

  function updateCard(el, diag) {
    const sc  = getStatusClass(diag.status);
    const ic  = getIcon(diag.status);
    const sev = diag.severity || 0;

    // Update card state class
    el.className = `diag-card state-${sc}`;

    // Badge
    const badge = el.querySelector('.diag-badge');
    badge.className = `diag-badge ${sc}`;
    badge.innerHTML = `<i class="fa-solid ${ic}"></i> ${diag.status}`;

    // Tip
    el.querySelector('.diag-tip').textContent = diag.tip;

    // Severity bar
    const barWrap = el.querySelector('.sev-bar-wrap');
    const barFill = el.querySelector('.sev-bar-fill');
    barWrap.style.display = sev > 0 ? 'block' : 'none';
    if (sev > 0) {
      barFill.style.width           = sev + '%';
      barFill.style.backgroundColor = severityColor(sev);
    }

    // Ghost legend
    let legend = el.querySelector('.ghost-legend');
    if (sev > 0 && !legend) {
      legend = document.createElement('div');
      legend.className = 'ghost-legend';
      legend.innerHTML = `<span class="ghost-legend-dot"></span> Green dashes = ideal target position on feed`;
      // insert before video dropdown if it exists, otherwise append
      const vd = el.querySelector('.video-dropdown');
      if (vd) el.insertBefore(legend, vd);
      else el.appendChild(legend);
    } else if (sev === 0 && legend) {
      legend.remove();
    }

    // Video dropdown
    let videoDropdown = el.querySelector('.video-dropdown');
    if (diag.video && diag.status === 'Bad') {
      const ytid = extractYouTubeId(diag.video);
      if (!videoDropdown) {
        videoDropdown = document.createElement('div');
        videoDropdown.className = 'video-dropdown';
        videoDropdown.innerHTML = `
          <div class="video-inner" onclick="window.open('${diag.video}', '_blank')">
            <img class="video-thumb" src="https://img.youtube.com/vi/${ytid}/0.jpg" alt="Exercise Video">
            <i class="fa-brands fa-youtube video-play-icon"></i>
          </div>
          <div class="video-label">Suggested Exercise</div>
        `;
        el.appendChild(videoDropdown);
      } else {
        // Update URL just in case it changed
        const inner = videoDropdown.querySelector('.video-inner');
        if (inner) inner.setAttribute('onclick', `window.open('${diag.video}', '_blank')`);
        const thumb = videoDropdown.querySelector('.video-thumb');
        if (thumb) thumb.src = `https://img.youtube.com/vi/${ytid}/0.jpg`;
      }
    } else if (videoDropdown) {
      videoDropdown.remove();
    }
  }

  function renderDiagnostics(diagnostics) {
    if (!diagnostics || diagnostics.length === 0) return;

    // Remove placeholder if still showing
    const placeholder = diagList.querySelector('.placeholder-msg');
    if (placeholder) placeholder.remove();

    const seen = new Set();

    diagnostics.forEach(diag => {
      seen.add(diag.issue);
      if (!cardMap.has(diag.issue)) {
        const card = createCard(diag);
        cardMap.set(diag.issue, card);
        diagList.appendChild(card);
      } else {
        updateCard(cardMap.get(diag.issue), diag);
      }
    });

    // Prune stale issues
    cardMap.forEach((card, issue) => {
      if (!seen.has(issue)) { card.remove(); cardMap.delete(issue); }
    });
  }

  // ── Chart.js Session Health ───────────────────────────────────────────────
  const CHART_LEN = 60;
  const chartLabels = Array(CHART_LEN).fill('');
  const chartData   = Array(CHART_LEN).fill(null);

  const chartCanvas = document.getElementById('healthChart');
  const chartCtx    = chartCanvas.getContext('2d');

  function makeGradient() {
    const grad = chartCtx.createLinearGradient(0, 0, 0, 120);
    grad.addColorStop(0, 'rgba(59,130,246,0.45)');
    grad.addColorStop(1, 'rgba(59,130,246,0)');
    return grad;
  }

  const healthChart = new Chart(chartCtx, {
    type: 'line',
    data: {
      labels: chartLabels,
      datasets: [{
        label: 'Avg Severity',
        data: chartData,
        borderColor: '#3b82f6',
        backgroundColor: makeGradient(),
        borderWidth: 2,
        tension: 0.45,
        fill: true,
        pointRadius: 0,
        pointHoverRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 400 },
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: {
          min: 0, max: 100,
          grid:  { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#7d8590', font: { size: 10 }, stepSize: 25 },
          border:{ display: false },
        },
        x: {
          grid:  { display: false },
          ticks: { display: false },
          border:{ display: false },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(22,27,34,0.95)',
          borderColor: 'rgba(59,130,246,0.4)',
          borderWidth: 1,
          titleColor: '#e6edf3',
          bodyColor: '#7d8590',
          padding: 10,
          callbacks: {
            label: ctx => ` Severity: ${ctx.parsed.y !== null ? ctx.parsed.y.toFixed(1) : '–'}`
          }
        }
      }
    }
  });

  function updateChartTheme() {
    const light = !isDark;
    const gridColor  = light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)';
    const tickColor  = light ? '#718096' : '#7d8590';
    const lineColor  = light ? '#2563eb' : '#3b82f6';
    const tBg        = light ? 'rgba(255,255,255,0.95)' : 'rgba(22,27,34,0.95)';
    const tBorder    = light ? 'rgba(37,99,235,0.3)' : 'rgba(59,130,246,0.4)';
    const tTitle     = light ? '#1a202c' : '#e6edf3';

    healthChart.data.datasets[0].borderColor = lineColor;
    healthChart.data.datasets[0].backgroundColor = makeGradient();
    healthChart.options.scales.y.grid.color   = gridColor;
    healthChart.options.scales.y.ticks.color  = tickColor;
    healthChart.options.plugins.tooltip.backgroundColor = tBg;
    healthChart.options.plugins.tooltip.borderColor     = tBorder;
    healthChart.options.plugins.tooltip.titleColor      = tTitle;
    healthChart.update();
  }

  // Push one average-severity sample per second
  let latestDiagnostics = [];

  setInterval(() => {
    const vals = latestDiagnostics.map(d => d.severity || 0);
    const avg  = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    const rounded = Math.round(avg);

    chartData.shift();
    chartData.push(rounded);
    chartLabels.shift();
    chartLabels.push('');
    healthChart.update();

    // Update avg badge color
    avgBadge.textContent = rounded;
    avgBadge.style.color = rounded > 0 ? severityColor(rounded) : 'var(--accent)';
  }, 1000);

  // ── WebSocket ─────────────────────────────────────────────────────────────
  let ws;

  function setStatus(connected) {
    if (connected) {
      statusBadge.classList.add('connected');
      statusText.textContent = 'Engine Online';
    } else {
      statusBadge.classList.remove('connected');
      statusText.textContent = 'Reconnecting…';
    }
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/analyze`);

    ws.onopen = () => {
      setStatus(true);
      setInterval(captureAndSend, 100); // 10 FPS
    };

    ws.onmessage = e => {
      const data = JSON.parse(e.data);

      // Hide loading overlay once first frame arrives
      if (loadingOverlay.style.display !== 'none') {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => loadingOverlay.style.display = 'none', 500);
      }

      processedImage.src = data.image;

      if (data.diagnostics && data.diagnostics.length) {
        latestDiagnostics = data.diagnostics;
        renderDiagnostics(data.diagnostics);
      }
    };

    ws.onclose = () => {
      setStatus(false);
      setTimeout(connectWS, 2500); // auto-reconnect
    };

    ws.onerror = () => ws.close();
  }

  function captureAndSend() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ws.send(canvas.toDataURL('image/jpeg', 0.6));
    }
  }

  // ── Webcam init ───────────────────────────────────────────────────────────
  async function startWebcam() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        connectWS();
      };
    } catch (err) {
      console.error('Webcam error:', err);
      loadingOverlay.querySelector('p').textContent = '⚠ Camera access denied. Please allow camera permission.';
    }
  }

  startWebcam();
});
</script>
</body>
</html>
